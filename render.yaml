databases:
  - name: gastos-db
    plan: free
    databaseName: gastos
    user: gastos

services:
  - type: web
    name: gastos-pagos-mrice
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: gastos-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DEMO_USER
        sync: false
      - key: DEMO_PASSWORD
        sync: false
